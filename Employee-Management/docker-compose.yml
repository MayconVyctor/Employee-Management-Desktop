services:
  postgres-db:
    image: postgres:16-alpine
    container_name: employee_control_db
    restart: always
    environment:
      POSTGRES_DB: employee_control
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports: 
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employee_control"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
  
      