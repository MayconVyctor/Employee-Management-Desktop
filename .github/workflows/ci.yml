name: Java CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: employee_control
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d employee_control"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Initialize databases
        run: |
          container_id=$(docker ps --filter "ancestor=postgres:16" --format "{{.ID}}" | head -n 1)

          docker exec -i "$container_id" \
            psql -v ON_ERROR_STOP=1 -U postgres -d employee_control \
            < Employee-Management/init.sql

          docker exec -i "$container_id" \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < Employee-Management/init-test.sql

      - name: Build and test
        working-directory: ./Employee-Management
        run: mvn -B clean verify